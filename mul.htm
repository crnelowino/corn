<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>

<script type="text/javascript">
    var number = 8;

    for (var i = 0; i <= 10; i++) {
        document.write(number + " x " + i + " = " + (number * i));
        document.write("<br>");
    }
</script>

</body>
</html>
